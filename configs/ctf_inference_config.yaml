# CTF Inference Config — Coarse-to-Fine Prompt Orchestration Pipeline
# Differences from inference_config.yaml:
#   1. model.target → models.ctf_model.ArtDaptedModelCTF
#   2. unet_config.target → models.ctf_unet.CTFUNetModel
#   3. Added CTF-specific params (style_start, clip_version)

dataset:
  target: dataset.CompArt
  params:
    dataset_path: thejinzhe/CompArt
    split: test
    dtype: float32
    image_size: 512

model:
  target: models.ctf_model.ArtDaptedModelCTF
  init_path: ./ckpt/trained/your_trained_checkpoint.ckpt
  sd_locked: True
  params:
    linear_start: 0.00085
    linear_end: 0.0120
    num_timesteps_cond: 1
    timesteps: 1000
    first_stage_key: "image"
    cond_stage_key: "caption"
    image_size: 64
    channels: 4
    cond_stage_trainable: false
    conditioning_key: crossattn
    monitor: val/loss_simple_ema
    scale_factor: 0.18215
    use_ema: False

    # CTF-specific params
    style_start: 0.7          # legacy, kept for backward compat
    clip_version: "openai/clip-vit-large-patch14"

    artdapter_config:
      target: models.ArtDapterTSC
      params:
        connector_in_dim: 2048

    unet_config:
      target: models.ctf_unet.CTFUNetModel    # ← CTF layer-aware routing
      params:
        image_size: 32
        in_channels: 4
        model_channels: 320
        out_channels: 4
        num_res_blocks: 2
        attention_resolutions: [4, 2, 1]
        channel_mult: [1, 2, 4, 4]
        use_checkpoint: False
        num_heads: 8
        use_spatial_transformer: True
        transformer_depth: 1
        context_dim: 768
        legacy: False

    first_stage_config:
      target: ldm.models.autoencoder.AutoencoderKL
      params:
        embed_dim: 4
        monitor: val/rec_loss
        ddconfig:
          double_z: true
          z_channels: 4
          resolution: 256
          in_channels: 3
          out_ch: 3
          ch: 128
          ch_mult:
          - 1
          - 2
          - 4
          - 4
          num_res_blocks: 2
          attn_resolutions: []
          dropout: 0.0
        lossconfig:
          target: torch.nn.Identity

    cond_stage_config:
      target: ldm.modules.encoders.T5Embedder
      params:
        max_length: 512

# CTF sampling defaults tuned for PoA (balance-focused) generation.
# Consumed by inference/app.py -> CTFDDIMSampler.sample(...).
ctf_sampling:
  layout_end:        0.30   # Phase 1 ends (fraction of denoise steps)
  content_end:       0.65   # Phase 2 ends
  blend_window:      0.08   # half-width of cosine blend window around content_end
  preserve_strength: 0.30   # SDEdit-lite anchor pull in Phase 3 (0 disables)
