name: artgen
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip

  # === Các package hệ thống ===
  - numpy
  - pillow
  - tqdm

  # === Pip packages ===
  - pip:
      # PyTorch + CUDA 12.8 (cài qua pip để tránh xung đột conda)
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.8.0
      - torchvision==0.23.0
      - torchaudio==2.8.0

      # Core training framework
      - pytorch-lightning==2.1.4
      - lightning==2.1.4

      # HuggingFace ecosystem
      - transformers>=4.36.0
      - datasets>=2.16.0
      - safetensors>=0.4.0

      # Diffusion & text encoders
      - diffusers>=0.25.0
      - open-clip-torch>=2.24.0
      - sentencepiece # T5 tokenizer dependency

      # Config & logging
      - omegaconf>=2.3.0
      - wandb>=0.16.0

      # Tensor utilities
      - einops>=0.7.0

      # Inference UI
      - streamlit>=1.30.0

      # Memory-efficient attention (highly recommended for RTX 5090)
      - xformers>=0.0.30

      # Font for log_txt_as_img visualization
      - fonttools
